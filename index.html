<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRA AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

    body {
      position: relative;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 15px;
      background: #050816;
    }

    body::before {
      content: "";
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: -2;
      background: conic-gradient(
        from 0deg,
        #0b132b,
        #2b0d42,
        #0d3b4c,
        #3d1328,
        #102542,
        #0b132b
      );
      animation: slowBgSpin 28s linear infinite;
      filter: blur(28px) saturate(1.25);
      opacity: 0.95;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, rgba(4, 10, 24, 0.25) 0%, rgba(2, 6, 15, 0.72) 100%);
      pointer-events: none;
    }

    @keyframes slowBgSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .header {
      width: 100%;
      max-width: 440px;
      text-align: center;
      border-bottom: 2px solid #ff9900;
      padding-bottom: 8px;
      background: rgba(5, 14, 30, 0.55);
      border-radius: 14px 14px 0 0;
      padding-top: 6px;
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 2.35rem;
      letter-spacing: 6px;
      color: #29f4ff;
      text-shadow: 0 0 16px rgba(41, 244, 255, 0.75), 2px 2px 0px #ff9900;
    }

    .subtitle {
      font-size: 0.7rem;
      color: #ffad33;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .voice-bar {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
    }

    select {
      background: rgba(6, 22, 42, 0.9);
      color: #6df8ff;
      border: 1px solid #ff9900;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
      outline: none;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 310px;
      height: 310px;
    }

    .pink-core-glow {
      position: absolute;
      width: 195px;
      height: 195px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 28, 138, 0.72) 0%,
        rgba(214, 15, 112, 0.42) 48%,
        rgba(120, 8, 72, 0.12) 72%,
        rgba(0, 0, 0, 0) 100%
      );
      box-shadow: 0 0 38px rgba(255, 24, 130, 0.38), inset 0 0 26px rgba(255, 75, 160, 0.35);
      transition: transform 0.35s ease, opacity 0.35s ease;
      pointer-events: none;
    }

    .stage.active .pink-core-glow {
      transform: scale(1.18);
      opacity: 1;
    }

    canvas {
      position: relative;
      z-index: 2;
      display: block;
      max-width: 100%;
    }

    .controls {
      text-align: center;
      width: 100%;
      max-width: 440px;
      padding-bottom: 10px;
    }

    #status {
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: #d9f8ff;
      background: rgba(4, 13, 28, 0.62);
      border: 1px solid rgba(41, 244, 255, 0.25);
      border-radius: 12px;
      padding: 8px 12px;
      min-height: 48px;
      max-height: 92px;
      overflow-y: auto;
      line-height: 1.35;
    }

    button {
      background: rgba(0, 240, 255, 0.16);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 13px 36px;
      font-size: 1.08rem;
      border-radius: 30px;
      font-weight: bold;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.38);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button.listening {
      background: #ff2a85;
      color: #ffffff;
      border-color: #ffad33;
      box-shadow: 0 0 22px rgba(255, 42, 133, 0.7);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AIRA</h1>
    <div class="subtitle">PERSONAL AI OF DINESH KUMAR GUPTA</div>
    <div class="voice-bar">
      <label for="voiceSelect" style="font-size: 0.8rem; color: #ffad33;">Voice:</label>
      <select id="voiceSelect">
        <option value="girl1">Girl 1 (Sweet & Normal)</option>
        <option value="girl2">Girl 2 (Soft & High)</option>
        <option value="boy1">Boy 1 (Normal Male)</option>
        <option value="boy2">Boy 2 (Deep & Heavy)</option>
      </select>
    </div>
  </div>

  <div class="stage" id="stageBox">
    <div class="pink-core-glow"></div>
    <canvas id="sphereCanvas" width="300" height="300"></canvas>
  </div>

  <div class="controls">
    <div id="status">नमस्ते सर, माइक दबाकर आदेश दें...</div>
    <button id="micBtn">🎤 Speak / बोलें</button>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6LAtb4KNJCCj5Q_OUindUnSFlLqehhxwTPq3bC1tBdStw";

    const canvas = document.getElementById('sphereCanvas');
    const ctx = canvas.getContext('2d');
    const stageBox = document.getElementById('stageBox');

    const CX = 150, CY = 150;
    let angleY = 0;
    let angleX = 0.25;
    let rotSpeed = 0.014;
    let spread = 0;
    let targetSpread = 0;

    const particles = [];
    const totalDots = 340;

    for (let i = 0; i < totalDots; i++) {
      const phi = Math.acos(-1 + (2 * i) / totalDots);
      const theta = Math.sqrt(totalDots * Math.PI) * phi;

      const dirX = Math.cos(theta) * Math.sin(phi);
      const dirY = Math.sin(theta) * Math.sin(phi);
      const dirZ = Math.cos(phi);

      const baseRadius = 56 + (i % 7) * 4.2;
      const isOrange = i % 3 === 0;
      const isPinkAccent = i % 5 === 0;

      particles.push({
        baseX: baseRadius * dirX,
        baseY: baseRadius * dirY,
        baseZ: baseRadius * dirZ,
        dirX,
        dirY,
        dirZ,
        radius: 2.3 + (i % 4) * 0.75,
        phase: i * 0.37,
        isOrange,
        isPinkAccent
      });
    }

    function setSpeakingState(isActive) {
      if (isActive) {
        targetSpread = 1;
        rotSpeed = 0.042;
        stageBox.classList.add('active');
      } else {
        targetSpread = 0;
        rotSpeed = 0.014;
        stageBox.classList.remove('active');
      }
    }

    function drawSphere() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      spread += (targetSpread - spread) * 0.09;

      const coreGrad = ctx.createRadialGradient(CX, CY, 8, CX, CY, 118);
      coreGrad.addColorStop(0, 'rgba(255, 45, 148, 0.78)');
      coreGrad.addColorStop(0.55, 'rgba(195, 14, 105, 0.42)');
      coreGrad.addColorStop(1, 'rgba(195, 14, 105, 0)');
      ctx.beginPath();
      ctx.arc(CX, CY, 118, 0, Math.PI * 2);
      ctx.fillStyle = coreGrad;
      ctx.fill();

      const projected = particles.map((p) => {
        const pulse = Math.sin(Date.now() * 0.004 + p.phase) * 2.5;
        const pushOut = spread * 38 + pulse;

        const px = p.baseX + p.dirX * pushOut;
        const py = p.baseY + p.dirY * pushOut;
        const pz = p.baseZ + p.dirZ * pushOut;

        const x1 = px * Math.cos(angleY) - pz * Math.sin(angleY);
        const z1 = pz * Math.cos(angleY) + px * Math.sin(angleY);

        const y2 = py * Math.cos(angleX) - z1 * Math.sin(angleX);
        const z2 = z1 * Math.cos(angleX) + py * Math.sin(angleX);

        const perspective = 250 / (250 + z2);
        return {
          sx: CX + x1 * perspective,
          sy: CY + y2 * perspective,
          z: z2,
          r: Math.max(1.2, p.radius * perspective),
          isOrange: p.isOrange,
          isPinkAccent: p.isPinkAccent
        };
      });

      projected.sort((a, b) => b.z - a.z);

      projected.forEach((pt) => {
        let color;
        if (pt.isOrange) {
          color = pt.z < 0 ? '#ff9d1c' : '#c96800';
        } else if (pt.isPinkAccent) {
          color = pt.z < 0 ? '#ff6ec7' : '#b51777';
        } else {
          color = pt.z < 0 ? '#3bf4ff' : '#0088b8';
        }

        ctx.beginPath();
        ctx.arc(pt.sx, pt.sy, pt.r * 1.45, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(pt.sx, pt.sy, pt.r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      });

      angleY += rotSpeed;
      requestAnimationFrame(drawSphere);
    }
    drawSphere();

    const voiceSelect = document.getElementById('voiceSelect');
    let availableVoices = [];

    function loadVoices() {
      availableVoices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    const voiceProfiles = {
      girl1: { pitch: 1.15, rate: 1.0, preferFemale: true },
      girl2: { pitch: 1.35, rate: 1.05, preferFemale: true },
      boy1:  { pitch: 0.85, rate: 0.98, preferFemale: false },
      boy2:  { pitch: 0.65, rate: 0.92, preferFemale: false }
    };

    function speak(text) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#_]/g, '');
      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = 'hi-IN';

      const selected = voiceSelect.value;
      const profile = voiceProfiles[selected] || voiceProfiles.girl1;

      const hindiVoices = availableVoices.filter(v => v.lang.includes('hi'));
      if (hindiVoices.length > 0) {
        if (profile.preferFemale) {
          u.voice = hindiVoices.find(v => /female|kalpana|swara|lekha|heera/i.test(v.name)) || hindiVoices[0];
        } else {
          u.voice = hindiVoices.find(v => /male|hemant|madhur|prabhat/i.test(v.name)) || hindiVoices[hindiVoices.length - 1];
        }
      }

      u.pitch = profile.pitch;
      u.rate = profile.rate;

      u.onstart = () => setSpeakingState(true);
      u.onend = () => setSpeakingState(false);
      u.onerror = () => setSpeakingState(false);

      window.speechSynthesis.speak(u);
    }

    voiceSelect.onchange = () => {
      speak("आवाज़ बदल दी गई है सर।");
    };

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let chatHistory = [];

    async function askAIRA(command) {
      const lowerCmd = command.toLowerCase();
      if (lowerCmd.includes('girl 1') || lowerCmd.includes('लड़की 1')) {
        voiceSelect.value = 'girl1';
        statusText.innerText = "Girl 1 आवाज़ सेट कर दी है सर।";
        speak("जी सर, अब मैं पहली लड़की की आवाज़ में बोल रही हूँ।");
        return;
      } else if (lowerCmd.includes('girl 2') || lowerCmd.includes('लड़की 2')) {
        voiceSelect.value = 'girl2';
        statusText.innerText = "Girl 2 आवाज़ सेट कर दी है सर।";
        speak("जी सर, अब मैं दूसरी लड़की की आवाज़ में बोल रही हूँ।");
        return;
      } else if (lowerCmd.includes('boy 1') || lowerCmd.includes('लड़का 1')) {
        voiceSelect.value = 'boy1';
        statusText.innerText = "Boy 1 आवाज़ सेट कर दी है सर।";
        speak("जी सर, अब मैं पहले लड़के की आवाज़ में बोल रहा हूँ।");
        return;
      } else if (lowerCmd.includes('boy 2') || lowerCmd.includes('लड़का 2')) {
        voiceSelect.value = 'boy2';
        statusText.innerText = "Boy 2 आवाज़ सेट कर दी है सर।";
        speak("जी सर, अब मैं भारी लड़के की आवाज़ में बोल रहा हूँ।");
        return;
      }

      const cleanKey = API_KEY.replace(/\s+/g, '');
      if (!cleanKey || cleanKey === "YAHAN_APNI_KEY_KAT_KE_LIKHO") {
        statusText.innerText = "सर, पहले API_KEY वाली जगह में अपनी की लिखें।";
        speak("सर, पहले एपीआई की लिखें।");
        return;
      }

      statusText.innerText = "सोच रही हूँ सर...";
      setSpeakingState(true);

      const systemRule = `तुम AIRA हो, दिनेश कुमार गुप्ता की पर्सनल सुपर AI। मालिक को "सर" कहो। देश-दुनिया के हर सवाल का छोटा और सटीक जवाब हिंदी में दो।
अगर कॉल करने कहें तो [CALL:नंबर], यूट्यूब/गाने चलाने कहें तो [YT:नाम], गूगल सर्च कहें तो [GO:शब्द], जीमेल खोलने कहें तो [MAIL:] लिखो।`;

      chatHistory.push({ role: "user", parts: [{ text: command }] });
      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': cleanKey
          },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemRule }] },
            contents: chatHistory
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        let reply = data.candidates[0].content.parts[0].text;
        chatHistory.push({ role: "model", parts: [{ text: reply }] });

        if (reply.includes('[CALL:')) {
          const match = reply.match(/\[CALL:(.*?)\]/);
          if (match) {
            const num = match[1].replace(/[^0-9+]/g, '');
            reply = reply.replace(/\[CALL:.*?\]/, '').trim();
            setTimeout(() => location.href = 'tel:' + num, 1000);
          }
        } else if (reply.includes('[YT:')) {
          const match = reply.match(/\[YT:(.*?)\]/);
          if (match) {
            const q = match[1];
            reply = reply.replace(/\[YT:.*?\]/, '').trim();
            setTimeout(() => window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(q), '_blank'), 1000);
          }
        } else if (reply.includes('[GO:')) {
          const match = reply.match(/\[GO:(.*?)\]/);
          if (match) {
            const q = match[1];
            reply = reply.replace(/\[GO:.*?\]/, '').trim();
            setTimeout(() => window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank'), 1000);
          }
        } else if (reply.includes('[MAIL:]')) {
          reply = reply.replace('[MAIL:]', '').trim();
          setTimeout(() => window.open('https://mail.google.com', '_blank'), 1000);
        }

        statusText.innerText = reply;
        speak(reply);
      } catch (err) {
        setSpeakingState(false);
        statusText.innerText = "त्रुटि: " + err.message;
        speak("क्षमा करें सर, सर्वर से संपर्क नहीं हो पाया।");
      }
    }

    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.lang = 'hi-IN';
      rec.interimResults = false;

      micBtn.onclick = () => {
        try {
          rec.start();
          micBtn.classList.add('listening');
          statusText.innerText = "सुन रही हूँ सर...";
          setSpeakingState(true);
        } catch (e) {
          statusText.innerText = "माइक पहले से चालू है सर।";
        }
      };

      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        statusText.innerText = "आप: " + text;
        micBtn.classList.remove('listening');
        askAIRA(text);
      };

      rec.onerror = () => {
        micBtn.classList.remove('listening');
        setSpeakingState(false);
        statusText.innerText = "आवाज़ नहीं आई सर, दोबारा दबाएं।";
      };

      rec.onend = () => {
        micBtn.classList.remove('listening');
        if (!window.speechSynthesis.speaking) {
          setSpeakingState(false);
        }
      };
    } else {
      statusText.innerText = "सर, इस ब्राउज़र में वॉइस रिकग्निशन सपोर्ट नहीं है (Chrome यूज़ करें)।";
    }
  </script>
</body>
  </html>
